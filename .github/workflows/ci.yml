name: CI
on:
  push: { branches: [main, feature/redesign] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: cronos }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://postgres:test@localhost:5432/cronos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de prueba (secretos generados, sin credenciales reales)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "DJANGO_SECRET_KEY=$(openssl rand -base64 60 | tr -d '
')"
            echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api"
            echo "FRONTEND_URL=http://localhost"
          } > "$RUNNER_TEMP/e2e.env"
      - run: ENV_FILE="$RUNNER_TEMP/e2e.env" docker compose --env-file "$RUNNER_TEMP/e2e.env" -f docker-compose.prod.yml up -d --build --wait
      - run: ENV_FILE="$RUNNER_TEMP/e2e.env" docker compose --env-file "$RUNNER_TEMP/e2e.env" -f docker-compose.prod.yml exec -T -e CONFIRMAR_CARGA_CATALOGO=true api python poblar_datos.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { E2E_BASE_URL: "http://localhost", E2E_FORWARD_HTTPS: "1" }
