# La carga del catalogo NO se ejecuta al arrancar: se hace una sola vez a mano (ver docs/DESPLIEGUE.md).
# Demo setup only. Free Render web services sleep and free Postgres expires after 30 days.
# Choose durable paid plans before relying on this deployment for customer or payment data.
databases:
  - name: cronos-geneve-db
    databaseName: cronos_geneve
    user: cronos_geneve
    plan: free
    postgresMajorVersion: "17"
    region: ohio

services:
  - type: web
    name: cronos-geneve-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py createcachetable && gunicorn cronos_elite.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /api/relojes/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cronos-geneve-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: MERCADOPAGO_ENVIRONMENT
        value: test
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_USD_PEN_RATE
        value: "3.75"
      - key: MERCADOPAGO_RESERVATION_MINUTES
        value: "30"

  - type: web
    name: cronos-geneve-frontend
    runtime: static
    rootDir: frontend
    buildCommand: bash render-build.sh
    staticPublishPath: dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: cronos-geneve-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
